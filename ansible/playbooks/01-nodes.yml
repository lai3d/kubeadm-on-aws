---
# Everything a node needs before kubeadm can run: kernel settings, a container
# runtime and the kubeadm/kubelet/kubectl packages. On EKS this is the AMI.
- name: Prepare all nodes
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Wait for cloud-init to finish (it holds the apt lock on first boot)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    # cloud-provider-aws matches a Node to its EC2 instance by name, and expects
    # the EC2 private DNS name (ip-10-0-1-23.<region>.compute.internal).
    # Ubuntu only sets the short hostname, so fetch the real one from IMDSv2.
    - name: Read the EC2 private DNS name from IMDS
      ansible.builtin.shell: |
        set -euo pipefail
        TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token \
          -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
        curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" \
          http://169.254.169.254/latest/meta-data/local-hostname
      args:
        executable: /bin/bash
      register: ec2_hostname
      changed_when: false

    - name: Set the hostname to the EC2 private DNS name
      ansible.builtin.hostname:
        name: "{{ ec2_hostname.stdout }}"
        use: systemd

    - name: Stop cloud-init from resetting the hostname on reboot
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
        content: "preserve_hostname: true\n"
        mode: "0644"

    - name: Disable swap
      ansible.builtin.shell: swapoff -a && sed -ri '/\sswap\s/s/^/#/' /etc/fstab
      changed_when: false

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Kernel network settings for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        mode: "0644"
      register: sysctl_conf

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      when: sysctl_conf.changed

    - name: Base packages
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gpg, jq]
        update_cache: true
        cache_valid_time: 3600

    - name: Keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # --- containerd -----------------------------------------------------------
    - name: Docker apt key (source of the containerd.io package)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: >
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        mode: "0644"
      register: docker_repo

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        update_cache: "{{ docker_repo.changed }}"

    # The package ships a config with the CRI plugin disabled; regenerate the
    # full default and switch runc to the systemd cgroup driver so it matches
    # the kubelet (a mismatch gives an unstable node under memory pressure).
    - name: Generate containerd config with the systemd cgroup driver
      ansible.builtin.shell: |
        set -euo pipefail
        containerd config default \
          | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml.new
        grep -q 'SystemdCgroup = true' /etc/containerd/config.toml.new
        if ! cmp -s /etc/containerd/config.toml.new /etc/containerd/config.toml; then
          mv /etc/containerd/config.toml.new /etc/containerd/config.toml
          echo changed
        else
          rm /etc/containerd/config.toml.new
        fi
      args:
        executable: /bin/bash
      register: containerd_config
      changed_when: "'changed' in containerd_config.stdout"

    - name: Restart containerd if its config changed
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
      when: containerd_config.changed

    # --- kubeadm, kubelet, kubectl -------------------------------------------
    # Skipped once kubeadm is present, so re-running this playbook never
    # downgrades a cluster that `make upgrade` already moved forward.
    - name: Check for an existing kubeadm
      ansible.builtin.stat:
        path: /usr/bin/kubeadm
      register: kubeadm_bin

    - name: Kubernetes apt repository (one repo per minor version)
      ansible.builtin.include_tasks: ../tasks/kubernetes-repo.yml
      vars:
        k8s_minor: "{{ kubernetes_version.split('.')[:2] | join('.') }}"
      when: not kubeadm_bin.stat.exists

    - name: Install kubeadm, kubelet and kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_version }}-*"
          - "kubeadm={{ kubernetes_version }}-*"
          - "kubectl={{ kubernetes_version }}-*"
      when: not kubeadm_bin.stat.exists

    - name: Hold Kubernetes packages (upgrades are done deliberately, by kubeadm)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
