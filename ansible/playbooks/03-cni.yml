---
- name: Install Cilium (CNI, kube-proxy replacement, Gateway API)
  hosts: control_plane
  become: true
  gather_facts: false
  environment: "{{ helm_env }}"
  tasks:
    # Cilium only enables its Gateway API controller if the CRDs already exist.
    - name: Install Gateway API CRDs
      ansible.builtin.command: >
        {{ kubectl }} apply --server-side -f
        https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
      register: gwapi
      changed_when: "'serverside-applied' in gwapi.stdout"

    - name: Render Cilium values
      ansible.builtin.template:
        src: ../templates/cilium-values.yaml.j2
        dest: /opt/lab/cilium-values.yaml
        mode: "0644"

    - name: Install Cilium
      ansible.builtin.command: >
        helm upgrade --install cilium cilium
        --repo https://helm.cilium.io
        --version {{ cilium_version }}
        --namespace kube-system
        -f /opt/lab/cilium-values.yaml
      changed_when: true

    - name: Wait for the Cilium agent on the control plane
      ansible.builtin.command: >
        {{ kubectl }} -n kube-system rollout status ds/cilium --timeout=300s
      changed_when: false
